<title>Career Skills Cram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #1b2430;
  --ink-soft: #4f5b6a;
  --muted: #6b7684;
  --line: #d6dce3;
  --accent: #2b50c8;
  --accent-soft: #e4eafb;
  --graphite: #2a2f36;
  --on-graphite: #ffffff;
  --good: #1f7a4d;
  --good-soft: #e1f2e8;
  --bad: #c4432b;
  --bad-soft: #fbe6e1;
  --star: #b7791f;
  --radius: 10px;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #11151b; --surface: #1a2029; --surface-2: #151a22; --ink: #e6eaf0; --ink-soft: #b9c1cc;
    --muted: #8e98a6; --line: #2c3440; --accent: #86a0f7; --accent-soft: #1f2a48; --graphite: #d9dee6;
    --on-graphite: #11151b; --good: #4cc38a; --good-soft: #15342a; --bad: #f07a64; --bad-soft: #3a1f1a; --star: #e0b04f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #11151b; --surface: #1a2029; --surface-2: #151a22; --ink: #e6eaf0; --ink-soft: #b9c1cc;
  --muted: #8e98a6; --line: #2c3440; --accent: #86a0f7; --accent-soft: #1f2a48; --graphite: #d9dee6;
  --on-graphite: #11151b; --good: #4cc38a; --good-soft: #15342a; --bad: #f07a64; --bad-soft: #3a1f1a; --star: #e0b04f;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); }
body { margin: 0; color: var(--ink); font: 15px/1.55 var(--sans); padding-inline: 16px; padding-block: 0 40px; }
.app { max-width: 820px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 22px 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font: 700 22px/1.1 var(--serif); letter-spacing: -0.01em; }
.brand small { display: block; font: 500 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.mark { display: flex; gap: 3px; }
.mark i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: block; }
.mark i.f { background: var(--graphite); border-color: var(--graphite); }
.tabs { display: flex; gap: 2px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; max-width: 100%; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--graphite); color: var(--on-graphite); }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.eyebrow { font: 600 11px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-soft); max-width: 62ch; margin: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0e1320; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0e1320; } }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; color: var(--ink-soft); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.chip .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.star { color: var(--star); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* setup */
.setup h2 { font: 600 20px/1.25 var(--serif); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font: 600 22px/1.1 var(--mono); }
.stat span { font-size: 12.5px; color: var(--muted); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.mode b { font-weight: 600; }
.mode span { font-size: 13px; color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.history { display: flex; flex-wrap: wrap; gap: 6px; }
.history span { font: 500 12.5px var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }

/* questions */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; scroll-margin-top: 16px; }
.q-head { display: flex; gap: 10px; align-items: baseline; }
.q-num { font: 600 13px var(--mono); color: var(--muted); min-width: 26px; }
.q-text { font-size: 16px; font-weight: 500; }
.tag { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: auto; white-space: nowrap; }
.opts { display: grid; gap: 6px; padding-left: 36px; }
.opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 6px 8px; }
.opt:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line); }
.opt:disabled { cursor: default; }
.bub { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; font: 600 11px var(--mono); color: var(--ink-soft); }
.opt.sel .bub { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.opt.right { background: var(--good-soft); }
.opt.right .bub { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { background: var(--bad-soft); }
.opt.wrong .bub { background: var(--bad); border-color: var(--bad); color: #fff; }
.why { margin-left: 36px; font-size: 14px; color: var(--ink-soft); background: var(--surface-2); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.why b { color: var(--ink); }
.sheet-list { display: grid; gap: 12px; }
.bar { position: sticky; bottom: 0; margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 -6px 18px rgba(20, 30, 45, .08); }
.bar .meter { flex: 1 1 160px; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar .meter i { display: block; height: 100%; background: var(--graphite); width: 0; transition: width .2s; }

/* results */
.score { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; }
.score .big { font: 700 56px/1 var(--serif); letter-spacing: -0.02em; }
.score .big small { font-size: 24px; color: var(--muted); font-weight: 600; }
.breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.breakdown div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.breakdown b { font: 600 16px var(--mono); display: block; }
.omr { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 18px; padding: 14px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; }
.omr-row { display: flex; align-items: center; gap: 5px; font: 500 12px var(--mono); }
.omr-row .n { width: 22px; text-align: right; color: var(--muted); margin-right: 3px; }
.omr-row i { width: 17px; height: 17px; border-radius: 50%; border: 1.3px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 9px; color: var(--muted); }
.omr-row i.c { border-color: var(--good); color: var(--good); }
.omr-row i.cf { background: var(--good); border-color: var(--good); color: #fff; }
.omr-row i.wf { background: var(--bad); border-color: var(--bad); color: #fff; }
.omr-row a { color: inherit; text-decoration: none; }

/* practice */
.p-intro { display: grid; gap: 4px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; }
.p-intro b { font: 600 17px/1.3 var(--serif); }
.p-intro span { font-size: 13.5px; color: var(--ink-soft); }
.again { display: inline-block; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--bad); background: var(--bad-soft); border-radius: 999px; padding: 3px 10px; }
.pstats { flex-wrap: wrap; display: flex; gap: 16px; font: 500 13px var(--mono); color: var(--muted); }
.pstats b { color: var(--ink); }

/* flashcards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; min-height: 240px; display: grid; align-content: start; gap: 12px; }
.card .head { font: 600 clamp(26px, 6vw, 36px)/1.15 var(--serif); letter-spacing: -0.01em; }
.card .sub { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
.card dt { font: 600 11.5px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card dd { margin: 0; }
.card .back { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 10px; }
.progress { height: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good); width: 0; transition: width .25s; }
.kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }

/* tables / worksheets / lookup */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.k { font-weight: 600; white-space: nowrap; }
.ans { transition: filter .15s; }
.hide-ans .ans:not(.shown) { filter: blur(6px); cursor: pointer; user-select: none; }
.search { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.hit { display: grid; gap: 2px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.hit:last-child { border-bottom: 0; }
.hit .t { font: 600 16px var(--serif); }
.hit .kind { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-soft); }
.note { font-size: 13px; color: var(--muted); }
@media (max-width: 520px) {
  .opts, .why { padding-left: 0; margin-left: 0; }
  .score .big { font-size: 46px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i class="f"></i><i></i><i></i></div>
      <div><h1>Career Skills Cram</h1><small>Roots · Synonyms · Antonyms · Idioms · Foreign phrases · Aptitude</small></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="practice">Practice</button>
      <button role="tab" data-tab="mock">Mock test</button>
      <button role="tab" data-tab="cards">Flashcards</button>
      <button role="tab" data-tab="sheets">Worksheets</button>
      <button role="tab" data-tab="lookup">Look up</button>
    </nav>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>const DATA = /*__DATA__*/;</script>
<script>
(() => {
  const view = document.getElementById("view");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("csc:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("csc:" + k, JSON.stringify(v)); } catch {} },
  };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const uniq = a => [...new Set(a)];
  const parts = s => String(s).split(/,\s*/).map(x => x.trim()).filter(Boolean);
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const LETTERS = "ABCD";
  const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  // ------------------------------------------------------------ question sources
  const SYN = DATA.synant.filter(e => !e.note);
  const TOPIC_LABEL = { root: "Root word", syn: "Synonym / meaning", ant: "Antonym", idiom: "Idiom", foreign: "Foreign phrase", apt: "Aptitude" };

  function mk(key, q, correct, distractors, why, topic) {
    const opts = shuffle([correct, ...distractors.slice(0, 3)]);
    return { key, q, opts, ans: opts.indexOf(correct), why, topic };
  }
  function aptQ(a) { return { key: "apt:" + a.n, q: a.q, opts: a.opts, ans: a.ans, why: esc(a.why), topic: "apt", sub: a.topic, src: "Self-assessment Q" + a.n }; }
  function revQ(r) { return { key: "rev:" + r.id, q: r.q, opts: r.opts, ans: r.ans, why: r.why, topic: r.topic, src: r.sets.join(", ") }; }

  const related = (e, x) => {
    const w = e.word.toLowerCase(), xw = x.word.toLowerCase();
    return [...parts(x.syn), ...parts(x.ant)].some(t => t.toLowerCase() === w) || [...parts(e.syn), ...parts(e.ant)].some(t => t.toLowerCase() === xw);
  };
  function synQ(e) {
    const bad = new Set([...parts(e.syn), ...parts(e.ant), e.word].map(x => x.toLowerCase()));
    const pool = uniq(shuffle(SYN).filter(x => x !== e && !related(e, x)).map(x => cap(parts(x.syn)[0]))).filter(w => w && !bad.has(w.toLowerCase()));
    return mk("syn:" + e.word, `Which is the closest synonym of “${e.word}”?`, cap(parts(e.syn)[0]), pool,
      `<b>${esc(e.word)}</b> = ${esc(e.syn)}. Antonyms: ${esc(e.ant)}.`, "syn");
  }
  function antQ(e) {
    const bad = new Set([...parts(e.syn), ...parts(e.ant), e.word].map(x => x.toLowerCase()));
    const trap = cap(parts(e.syn)[0]);
    const pool = uniq(shuffle(SYN).filter(x => x !== e && !related(e, x)).map(x => cap(parts(x.ant)[0]))).filter(w => w && !bad.has(w.toLowerCase()));
    return mk("ant:" + e.word, `Which is the antonym of “${e.word}”?`, cap(parts(e.ant)[0]), [trap, ...pool],
      `<b>${esc(e.word)}</b> = ${esc(e.syn)} → opposite: ${esc(e.ant)}. (${esc(trap)} is a synonym — the classic trap.)`, "ant");
  }
  const rootPats = r => r.root.split("/").map(s => s.trim().toLowerCase());
  const firstEx = r => r.examples.split(",")[0].replace(/\(.*?\)/g, "").trim();
  function rootQ(r) {
    const words = new Set(r.meaning.toLowerCase().match(/[a-z]{4,}/g) || []);
    if (Math.random() < 0.5) {
      const pool = uniq(shuffle(DATA.roots).filter(x => x !== r && !(x.meaning.toLowerCase().match(/[a-z]{4,}/g) || []).some(w => words.has(w))).map(x => x.meaning));
      return mk("rootm:" + r.root, `The root “${r.root}” means:`, r.meaning, pool,
        `<b>${esc(r.root)}</b> (${esc(r.origin)}) = ${esc(r.meaning)} → ${esc(r.examples)}.`, "root");
    }
    const pats = rootPats(r);
    const pool = uniq(shuffle(DATA.roots).filter(x => x !== r && x.meaning !== r.meaning).map(firstEx)).filter(w => !pats.some(p => w.toLowerCase().includes(p)));
    return mk("roote:" + r.root, `Which word contains the root “${r.root}” (${r.meaning})?`, firstEx(r), pool,
      `<b>${esc(r.root)}</b> = ${esc(r.meaning)} → ${esc(r.examples)}.`, "root");
  }
  // near-synonymous entries must never appear as each other's distractors
  const STOP = new Set("that this with from have when someone something your very being more much what they them their does into over about only other which will would there these those than then were been".split(" "));
  const toks = s => new Set((String(s).toLowerCase().match(/[a-z]{4,}/g) || []).filter(w => !STOP.has(w)).map(w => w.slice(0, 4)));
  const clash = (a, b) => { const A = toks(a); for (const w of toks(b)) if (A.has(w)) return true; return false; };
  const GROUPS = [["out on a limb", "go out on a limb"], ["in camera", "sub rosa"], ["magnum opus", "tour de force"], ["legion", "hoi polloi"],
    ["kosmos", "orbis terrarum"], ["gratis", "pro bono"], ["hit the hay", "hit the sack"], ["cry wolf", "to cry wolf"]];
  const grouped = (a, b) => GROUPS.some(g => g.includes(a.toLowerCase()) && g.includes(b.toLowerCase()));
  const IDI = DATA.idioms.filter(i => i.meaning.length < 150);
  function idiomQ(i) {
    const others = shuffle(IDI).filter(x => x !== i && !grouped(x.idiom, i.idiom) && !clash(x.meaning, i.meaning));
    if (Math.random() < 0.6) {
      return mk("idm:" + i.idiom, `“${i.idiom}” means:`, i.meaning, uniq(others.map(x => x.meaning)), `<b>${esc(i.idiom)}</b> — ${esc(i.meaning)}${i.example ? `<br><i>${esc(i.example)}</i>` : ""}`, "idiom");
    }
    return mk("idr:" + i.idiom, `Which idiom means “${i.meaning.replace(/\.$/, "")}”?`, i.idiom, uniq(others.map(x => x.idiom)), `<b>${esc(i.idiom)}</b> — ${esc(i.meaning)}`, "idiom");
  }
  function foreignQ(f) {
    const others = shuffle(DATA.foreign).filter(x => x !== f && !grouped(x.phrase, f.phrase) && !clash(x.meaning, f.meaning));
    if (Math.random() < 0.6) {
      return mk("fm:" + f.phrase, `“${f.phrase}” means:`, f.meaning, uniq(others.map(x => x.meaning)), `<b>${esc(f.phrase)}</b> (${esc(f.lang)}) — ${esc(f.meaning)}`, "foreign");
    }
    return mk("fr:" + f.phrase, `Which expression means “${f.meaning}”?`, f.phrase, uniq(others.map(x => x.phrase)), `<b>${esc(f.phrase)}</b> (${esc(f.lang)}) — ${esc(f.meaning)}`, "foreign");
  }
  function foreignWsQ(w) {
    const opts = w.opts.slice();
    return { key: "fws:" + w.n, q: w.q, opts, ans: w.ans, why: esc(w.why), topic: "foreign", src: "Foreign worksheet A" + w.n };
  }
  const gen = {
    rev: n => shuffle(DATA.rev).slice(0, n).map(revQ),
    synant: n => shuffle(SYN).slice(0, n).map((e, k) => (k % 2 ? antQ(e) : synQ(e))),
    roots: n => shuffle(DATA.roots).slice(0, n).map(rootQ),
    idioms: n => shuffle(IDI).slice(0, n).map(idiomQ),
    foreign: n => shuffle(DATA.foreign).slice(0, n).map(foreignQ),
    foreignWs: n => shuffle(DATA.ws.foreign_a).slice(0, n).map(foreignWsQ),
  };

  // ------------------------------------------------------------ aptitude drills: fresh questions in the sheet's types, answers computed
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const one = a => a[Math.floor(Math.random() * a.length)];
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  const ratio = (a, b) => { const g = gcd(a, b); return `${a / g} : ${b / g}`; };
  const AL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const pos = ch => AL.indexOf(ch) + 1;

          <div class="stat"><b>${DATA.roots.length}</b><span>root words</span></div>
          <div class="stat"><b>${DATA.synant.length}</b><span>synonym/antonym entries</span></div>
          <div class="stat"><b>${DATA.idioms.length}</b><span>idioms &amp; phrases</span></div>
          <div class="stat"><b>${DATA.foreign.length}</b><span>foreign expressions</span></div>

        </div>
      </div>
      <div class="panel stack">
        <div class="eyebrow">Choose a paper</div>
        <div class="modes">${MODES.filter(m => m.id.length > 1).map(m => `<button class="mode" aria-pressed="${m.id === sel}" data-mode="${m.id}"><b>${m.name}</b><span>${m.desc}</span></button>`).join("")}</div>
        <div class="row"><span class="small muted">Or sit a printed set, in its original order:</span>${MODES.filter(m => m.id.length === 1).map(m => `<button class="chip mode-chip" aria-pressed="${m.id === sel}" data-mode="${m.id}">Set ${m.id}</button>`).join("")}</div>
        <div class="row"><button class="btn primary" id="start">Start test</button><span class="note">Answers stay hidden until you submit, like the real paper.</span></div>
        ${hist.length ? `<div class="stack" style="gap:6px"><div class="eyebrow">Your recent scores</div><div class="history">${hist.slice(0, 12).map(h => `<span title="${esc(h.mode)}">${h.score}/${h.total} · ${esc(h.mode)}</span>`).join("")}</div></div>` : ""}
      </div>
    </section>`;
    view.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
      view.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
      store.set("mockMode", b.dataset.mode);
    });
    view.querySelector("#start").onclick = () => {
      const mode = MODES.find(m => m.id === store.get("mockMode", "pool")) || MODES[0];
      startMock(mode.build(), mode.name);
    };
  }
  function startMock(qs, modeName) {
    mock = { qs, modeName, answers: Array(qs.length).fill(null), start: Date.now(), done: false, confirm: false };
    renderMock();
    window.scrollTo({ top: 0 });
  }
  function renderMock() {
    clearInterval(timer);
    const m = mock;
    if (m.done) return renderResults();
    view.innerHTML = `<section>
      <div class="row" style="justify-content:space-between;margin-bottom:12px"><div><div class="eyebrow">${esc(m.modeName)}</div></div><button class="btn" id="quit">Leave test</button></div>
      <div class="sheet-list">${m.qs.map((q, i) => qHTML(q, i, { chosen: m.answers[i] })).join("")}</div>
      <div class="bar"><span class="mono small" id="count"></span><span class="meter"><i id="meter"></i></span><span class="mono small" id="clock">0:00</span><button class="btn primary" id="submit">Submit</button></div>
    </section>`;
    const upd = () => {
      const n = m.answers.filter(a => a != null).length;
      view.querySelector("#count").textContent = `${n}/${m.qs.length} answered`;
      view.querySelector("#meter").style.width = (100 * n / m.qs.length) + "%";
      const sub = view.querySelector("#submit");
      sub.textContent = m.confirm ? `${m.qs.length - n} blank — submit anyway` : "Submit";
    };
    upd();
    view.querySelector(".sheet-list").onclick = e => {
      const b = e.target.closest(".opt"); if (!b) return;
      const i = +b.dataset.q, k = +b.dataset.k;
      m.answers[i] = m.answers[i] === k ? null : k;
      b.parentElement.querySelectorAll(".opt").forEach((o, kk) => { o.classList.toggle("sel", m.answers[i] === kk); o.setAttribute("aria-checked", m.answers[i] === kk); });
      m.confirm = false; upd();
    };
    view.querySelector("#submit").onclick = () => {
      const blank = m.answers.filter(a => a == null).length;
      if (blank && !m.confirm) { m.confirm = true; return upd(); }
      finishMock();
    };
    view.querySelector("#quit").onclick = () => { clearInterval(timer); mock = null; renderMockSetup(); };
    const clock = view.querySelector("#clock");
    timer = setInterval(() => { clock.textContent = fmtTime(Math.floor((Date.now() - m.start) / 1000)); }, 1000);
  }
  function finishMock() {
    const m = mock;
    clearInterval(timer);
    m.done = true;
    m.secs = Math.floor((Date.now() - m.start) / 1000);
    m.score = m.qs.reduce((s, q, i) => s + (m.answers[i] === q.ans), 0);
    m.qs.forEach((q, i) => { if (m.answers[i] !== q.ans) mistakes.add(q); });
    const hist = store.get("history", []);
    hist.unshift({ score: m.score, total: m.qs.length, mode: m.modeName, at: Date.now() });
    store.set("history", hist.slice(0, 30));
    renderResults();
    window.scrollTo({ top: 0 });
  }
  function renderResults() {
    const m = mock;
    const pct = Math.round(100 * m.score / m.qs.length);
    const by = {};
    m.qs.forEach((q, i) => { const t = q.sub || TOPIC_LABEL[q.topic] || "Other"; by[t] = by[t] || [0, 0]; by[t][1]++; if (m.answers[i] === q.ans) by[t][0]++; });
    const wrong = m.qs.map((q, i) => [q, i]).filter(([q, i]) => m.answers[i] !== q.ans);
    const verdict = pct >= 90 ? "Exam-ready. Skim your misses and sleep." : pct >= 75 ? "Solid. Clear the misses below, then take another paper." : pct >= 50 ? "Getting there. Drill the weak section in Flashcards, then retake." : "Start with Flashcards → “Roots in the tests”, then come back.";
    view.innerHTML = `<section class="stack">
      <div class="panel stack">
        <div class="eyebrow">${esc(m.modeName)} · ${fmtTime(m.secs)}</div>
        <div class="score"><div class="big mono">${m.score}<small>/${m.qs.length}</small></div><div><b>${pct}%</b><div class="muted">${verdict}</div></div></div>
        <div class="breakdown">${Object.entries(by).map(([t, [c, n]]) => `<div><b>${c}/${n}</b>${esc(t)}</div>`).join("")}</div>
        <div class="row">${wrong.length ? `<button class="btn primary" id="retry">Retake the ${wrong.length} I missed</button>` : ""}<button class="btn" id="again">New paper</button></div>
      </div>
      <div class="panel stack">
        <div class="eyebrow">Your answer sheet</div>
        <div class="omr">${m.qs.map((q, i) => `<a class="omr-row" href="#q${i}" data-jump="${i}"><span class="n">${i + 1}</span>${q.opts.map((_, k) => {
          const a = m.answers[i]; let c = "";
          if (k === q.ans && a === k) c = "cf"; else if (k === a) c = "wf"; else if (k === q.ans) c = "c";
          return `<i class="${c}">${LETTERS[k]}</i>`;
        }).join("")}</a>`).join("")}</div>
        <div class="note">Green outline = correct answer you missed · red = your wrong pick · filled green = right.</div>
      </div>
      ${wrong.length ? `<div class="eyebrow" style="margin-top:6px">Review · ${wrong.length} to fix</div><div class="sheet-list">${wrong.map(([q, i]) => qHTML(q, i, { chosen: m.answers[i], reveal: true })).join("")}</div>` : ""}
    </section>`;
    view.querySelector("#again").onclick = () => { mock = null; renderMockSetup(); window.scrollTo({ top: 0 }); };
    const r = view.querySelector("#retry");
    if (r) r.onclick = () => startMock(wrong.map(([q]) => q), "Retake: missed questions");
    view.querySelector(".omr").onclick = e => {
      const a = e.target.closest("[data-jump]"); if (!a) return;
      e.preventDefault();
      const el = document.getElementById("q" + a.dataset.jump);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  }

  // ------------------------------------------------------------ PRACTICE
  const P_TOPICS = [
    { id: "rev", name: "Real test questions", n: () => DATA.rev.length, next: () => revQ(DATA.rev[Math.floor(Math.random() * DATA.rev.length)]) },
    { id: "roots", name: "Root words", n: () => DATA.roots.length, next: () => gen.roots(1)[0] },
    { id: "synant", name: "Synonyms & antonyms", n: () => SYN.length, next: () => gen.synant(1)[0] },
    { id: "idioms", name: "Idioms", n: () => IDI.length, next: () => gen.idioms(1)[0] },
    { id: "foreign", name: "Foreign phrases", n: () => DATA.foreign.length, next: () => gen.foreign(1)[0] },
    { id: "apt", name: "Aptitude sheet", n: () => DATA.apt.length, next: () => aptQ(DATA.apt[Math.floor(Math.random() * DATA.apt.length)]) },
    { id: "aptdrill", name: "Aptitude drill (new)", n: () => "∞", next: () => gen.aptOne() },
    { id: "fws", name: "Foreign worksheet (fill-in)", n: () => DATA.ws.foreign_a.length, next: () => gen.foreignWs(1)[0] },
    { id: "mistakes", name: "My mistakes", n: () => mistakes.all().length, next: () => { const m = mistakes.all(); return m.length ? m[Math.floor(Math.random() * Math.min(m.length, 40))] : null; } },
  ];
  let prac = { topic: store.get("pTopic", "rev"), q: null, chosen: null, right: 0, seen: 0, streak: 0, lastKey: null, retry: [], again: false };
  function nextPractice() {
    // a question you missed comes back 3 questions later, until you get it right
    const due = prac.retry.findIndex(r => r.due <= prac.seen);
    let q;
    if (due >= 0) { q = prac.retry.splice(due, 1)[0].q; prac.again = true; }
    else {
      const t = P_TOPICS.find(x => x.id === prac.topic) || P_TOPICS[0];
      q = t.next();
      for (let tries = 0; q && q.key === prac.lastKey && tries < 5 && t.n() > 1; tries++) q = t.next();
      prac.again = false;
    }
    prac.q = q; prac.chosen = null; prac.lastKey = q && q.key;
    renderPractice();
  }
  function renderPractice() {
    const q = prac.q;
    view.innerHTML = `<section class="stack">
      <div class="row" role="group" aria-label="Topic">${P_TOPICS.map(t => `<button class="chip" aria-pressed="${t.id === prac.topic}" data-t="${t.id}">${t.name}<span class="n">${t.n()}</span></button>`).join("")}</div>
      <div class="p-intro"><b>Answer, see why, and your misses come back.</b><span>Get one wrong and it returns three questions later, in any topic, until you get it right. It's also saved to <i>My mistakes</i> for tomorrow morning.</span></div>
      <div class="pstats"><span>Score <b>${prac.right}/${prac.seen}</b></span><span>Streak <b>${prac.streak}</b></span><span>Coming back <b>${prac.retry.length}</b></span><span class="muted">Keys: <span class="kbd">A</span>–<span class="kbd">D</span> answer · <span class="kbd">Enter</span> next</span></div>
      ${q && prac.again ? `<div><span class="again">Back again: you missed this one</span></div>` : ""}
      ${q ? qHTML(q, 0, { chosen: prac.chosen, reveal: prac.chosen != null }) : `<div class="panel">No mistakes saved yet. Every question you miss in a test or here lands in this list until you get it right.</div>`}
      ${q && prac.chosen != null ? `<div class="row"><button class="btn primary" id="next">Next question</button></div>` : ""}
    </section>`;
    view.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { prac.topic = b.dataset.t; store.set("pTopic", prac.topic); nextPractice(); });
    const qEl = view.querySelector(".q");
    if (qEl) qEl.querySelector(".num, .q-num").textContent = "";
    if (qEl && prac.chosen == null) qEl.onclick = e => { const b = e.target.closest(".opt"); if (b) answerPractice(+b.dataset.k); };
    const n = view.querySelector("#next"); if (n) { n.onclick = nextPractice; n.focus({ preventScroll: true }); }
  }
  function answerPractice(k) {
    if (!prac.q || prac.chosen != null) return;
    prac.chosen = k; prac.seen++;
    if (k === prac.q.ans) { prac.right++; prac.streak++; if (prac.topic === "mistakes" || prac.again) mistakes.remove(prac.q.key); }
    else { prac.streak = 0; mistakes.add(prac.q); prac.retry.push({ q: prac.q, due: prac.seen + 3 }); }
    renderPractice();
  }

  // ------------------------------------------------------------ FLASHCARDS
  const DECKS = [
    { id: "rootsT", name: "Roots in the tests", items: () => DATA.roots.filter(r => r.tested), kind: "root" },
    { id: "roots", name: "All roots", items: () => DATA.roots, kind: "root" },
    { id: "synT", name: "Word pairs in the tests", items: () => DATA.synant.filter(e => e.tested), kind: "syn" },
    { id: "syn", name: "All word pairs", items: () => DATA.synant, kind: "syn" },
    { id: "idiomsW", name: "Worksheet idioms", items: () => DATA.idioms.filter(i => i.worksheet), kind: "idiom" },
    { id: "idioms", name: "All idioms", items: () => DATA.idioms, kind: "idiom" },
    { id: "foreignW", name: "Worksheet foreign phrases", items: () => DATA.foreign.filter(f => f.worksheet), kind: "foreign" },
    { id: "foreign", name: "All foreign phrases", items: () => DATA.foreign, kind: "foreign" },
  ];
  let fc = null;
  function startDeck(id) {
    const d = DECKS.find(x => x.id === id) || DECKS[0];
    store.set("deck", d.id);
    const items = d.items();
    fc = { deck: d, total: items.length, queue: shuffle(items), known: 0, flipped: false };
    renderCards();
  }
  function cardFace(kind, it) {
    if (kind === "root") return { head: it.root, sub: `Root · ${it.origin}${it.tested ? " · ★ in tests" : ""}`, back: `<dl><dt>Means</dt><dd><b>${esc(it.meaning)}</b></dd><dt>Examples</dt><dd>${esc(it.examples)}</dd></dl>` };
    if (kind === "syn") return { head: it.word, sub: `Synonyms & antonyms${it.tested ? " · ★ in tests" : ""}`, back: `<dl><dt>Synonyms</dt><dd><b>${esc(it.syn)}</b></dd><dt>Antonyms</dt><dd>${esc(it.ant)}</dd></dl>${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}` };
    if (kind === "idiom") return { head: it.idiom, sub: `Idiom${it.worksheet ? " · ★ on worksheet" : ""}`, back: `<dl><dt>Means</dt><dd><b>${esc(it.meaning)}</b></dd>${it.example ? `<dt>Use</dt><dd><i>${esc(it.example)}</i></dd>` : ""}</dl>` };
    return { head: it.phrase, sub: `${it.lang}${it.worksheet ? " · ★ on worksheet" : ""}`, back: `<dl><dt>Means</dt><dd><b>${esc(it.meaning)}</b></dd><dt>From</dt><dd>${esc(it.lang)}</dd></dl>` };
  }
  function renderCards() {
    if (!fc) return startDeck(store.get("deck", "rootsT"));
    const it = fc.queue[0];
    const face = it && cardFace(fc.deck.kind, it);
    view.innerHTML = `<section class="stack">
      <div class="row"><label class="eyebrow" for="deck">Deck</label>
        <select id="deck">${DECKS.map(d => `<option value="${d.id}" ${d.id === fc.deck.id ? "selected" : ""}>${d.name} (${d.items().length})</option>`).join("")}</select>
        <span class="mono small muted">${fc.known} known · ${fc.queue.length} left</span></div>
      <div class="progress"><i style="width:${100 * fc.known / Math.max(fc.total, 1)}%"></i></div>
      ${it ? `<div class="card" id="card">
          <div class="sub">${esc(face.sub)}</div>
          <div class="head">${esc(face.head)}</div>
          ${fc.flipped ? `<div class="back">${face.back}</div>` : `<div class="muted small">Say the meaning out loud, then flip.</div>`}
        </div>
        <div class="row">
          ${fc.flipped ? `<button class="btn" id="again">Again <span class="kbd">←</span></button><button class="btn primary" id="got">Got it <span class="kbd">→</span></button>` : `<button class="btn primary" id="flip">Flip <span class="kbd">Space</span></button>`}
        </div>`
      : `<div class="panel stack"><b>Deck cleared — all ${fc.total} known.</b><div class="row"><button class="btn primary" id="restart">Go through it again</button></div></div>`}

    on("#restart", () => startDeck(fc.deck.id));
  }

  function rateCard(ok) {

    const it = fc.queue.shift();

    else fc.queue.splice(Math.min(fc.queue.length, 3 + Math.floor(Math.random() * 3)), 0, it);
    fc.flipped = false; renderCards();
  }

  // ------------------------------------------------------------ WORKSHEETS
  let wsTab = store.get("wsTab", "iq2"), hideAns = store.get("hideAns", false);
  function renderSheets() {
    const W = DATA.ws;
    const tabs = [["iq2", "Idioms Q2 · meaning → idiom"], ["iq1", "Idioms Q1 · sentences"], ["fa", "Foreign A · fill in the blank"], ["fb", "Foreign B · sentences"]];
    let body = "";
    if (wsTab === "iq2") body = `<table><thead><tr><th>#</th><th>Meaning</th><th>Idiom</th></tr></thead><tbody>${W.idioms_q2.map(r => `<tr><td class="mono">${r.letter}</td><td>${esc(r.meaning)}</td><td class="k ans">${esc(r.answer)}</td></tr>`).join("")}</tbody></table>`;
    if (wsTab === "iq1") body = `<table><thead><tr><th>Idiom</th><th>Model sentence</th></tr></thead><tbody>${W.idioms_q1.map(r => { const m = DATA.idioms.find(i => i.idiom.toLowerCase() === r.item.toLowerCase()); return `<tr><td class="k">${esc(r.item)}<div class="note ans">${esc(m ? m.meaning : "")}</div></td><td class="ans">${esc(r.sentence)}</td></tr>`; }).join("")}</tbody></table>`;
    if (wsTab === "fa") body = `<table><thead><tr><th>#</th><th>Sentence</th><th>Answer</th></tr></thead><tbody>${W.foreign_a.map(r => `<tr><td class="mono">${r.n}</td><td>${esc(r.q)}<div class="note">${r.opts.map(esc).join(" / ")}</div></td><td class="ans"><b>${esc(r.opts[r.ans])}</b><div class="note">${esc(r.why)}</div></td></tr>`).join("")}</tbody></table>`;
    if (wsTab === "fb") body = `<table><thead><tr><th>Term</th><th>Meaning</th><th>Model sentence</th></tr></thead><tbody>${W.foreign_b.map(r => `<tr><td class="k">${esc(r.term)}</td><td class="ans">${esc(r.meaning)}</td><td class="ans">${esc(r.sentence)}</td></tr>`).join("")}</tbody></table>`;

      <div class="row" role="group" aria-label="Worksheet">${tabs.map(([id, n]) => `<button class="chip" aria-pressed="${id === wsTab}" data-w="${id}">${n}</button>`).join("")}</div>

      ${wsTab === "fa" ? `<p class="note">Items 1, 9, 11 and 16 are loosely worded on the sheet; the notes explain the best pick.</p>` : ""}

  }

  // ------------------------------------------------------------ LOOKUP
  const INDEX = [
    ...DATA.roots.map(r => ({ kind: "Root", t: r.root, d: `${r.meaning} — ${r.examples}`, star: r.tested })),
    ...DATA.synant.map(e => ({ kind: "Word", t: e.word, d: `Syn: ${e.syn} · Ant: ${e.ant}`, star: e.tested })),
    ...DATA.idioms.map(i => ({ kind: "Idiom", t: i.idiom, d: i.meaning, star: i.worksheet })),
    ...DATA.foreign.map(f => ({ kind: f.lang, t: f.phrase, d: f.meaning, star: f.worksheet })),
  ];
  let lookQ = "";
  function renderLookup() {
    view.innerHTML = `<section class="stack">
      <input class="search" id="search" type="search" placeholder="Search a word, root, idiom or phrase…" autocomplete="off" value="${esc(lookQ)}">
      <div class="note"><span class="star">★</span> = appears in the revision tests or worksheets.</div>
      <div class="tbl-wrap" id="hits"></div>
    </section>`;
    const inp = view.querySelector("#search"), hits = view.querySelector("#hits");
    const run = () => {
      lookQ = inp.value.trim().toLowerCase();
      let res = lookQ ? INDEX.filter(x => x.t.toLowerCase().includes(lookQ) || x.d.toLowerCase().includes(lookQ)) : INDEX.filter(x => x.star && x.kind === "Word");
      res.sort((a, b) => (b.t.toLowerCase().startsWith(lookQ) - a.t.toLowerCase().startsWith(lookQ)) || (b.star - a.star));
      const head = lookQ ? "" : `<div class="hit"><span class="kind">No search yet</span><span class="muted small">Showing the ${res.length} word pairs used in the revision tests.</span></div>`;
      hits.innerHTML = head + (res.slice(0, 80).map(x => `<div class="hit"><span class="kind">${esc(x.kind)}</span><span class="t">${x.star ? '<span class="star">★</span> ' : ""}${esc(x.t)}</span><span class="small">${esc(x.d)}</span></div>`).join("") || `<div class="hit muted">Nothing matches “${esc(lookQ)}”. Try a shorter part of the word.</div>`);
    };
    inp.oninput = run; run();
  }

  // ------------------------------------------------------------ tabs & keys
  const RENDER = { mock: () => (mock ? renderMock() : renderMockSetup()), practice: () => (prac.q ? renderPractice() : nextPractice()), cards: renderCards, sheets: renderSheets, lookup: renderLookup };
  let tab = "practice";
  function go(t) {
    if (tab === "mock" && t !== "mock") clearInterval(timer);
    tab = RENDER[t] ? t : "mock";
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
    store.set("tab2", tab);
    RENDER[tab]();
  }
  document.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); };
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (tab === "practice") {
      const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
      if (idx >= 0 && prac.q && prac.chosen == null && idx < prac.q.opts.length) { e.preventDefault(); answerPractice(idx); }
      else if (k === "enter" && prac.chosen != null) { e.preventDefault(); nextPractice(); }
    } else if (tab === "cards" && fc) {
      if (k === " " && !fc.flipped) { e.preventDefault(); flipCard(); }
      else if (k === "arrowright" || (k === " " && fc.flipped)) { e.preventDefault(); rateCard(true); }
      else if (k === "arrowleft") { e.preventDefault(); rateCard(false); }
    }
